<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>UPGRADER CS2 - Симулятор Апгрейда</title>
  <style>
    :root {
      --bg: #0d111a;
      --bg-panel: #131926;
      --bg-card: #192234;
      --accent-green: #00e701;
      --accent-neon: #00f2fe;
      --accent-purple: #9d4edd;
      --accent-gold: #ffb703;
      --accent-red: #ff3366;
      --text: #ffffff;
      --text-muted: #7e8ba3;
      --border: #243049;
    }
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Header */
    header {
      background: #111723;
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }
    .logo-box {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-badge {
      background: linear-gradient(135deg, #00f2fe, #4facfe);
      color: #0b0f19;
      font-weight: 900;
      font-size: 14px;
      padding: 4px 8px;
      border-radius: 6px;
    }
    .logo-text {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #fff;
    }
    .balance-box {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #192234;
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 20px;
    }
    .balance-val {
      font-weight: 800;
      font-size: 15px;
      color: var(--accent-gold);
    }
    .add-coins-btn {
      background: linear-gradient(135deg, #00c853, #00e676);
      border: none;
      color: #0d111a;
      font-weight: 900;
      font-size: 13px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Main Container */
    .app-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      position: relative;
    }

    /* Roulette / Circle upgrade area */
    .upgrade-arena {
      padding: 16px 12px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: radial-gradient(circle at center, #1b253b 0%, var(--bg) 70%);
      border-bottom: 1px solid var(--border);
    }

    .duel-slots {
      display: flex;
      align-items: center;
      justify-content: space-around;
      width: 100%;
      max-width: 420px;
      margin-bottom: 16px;
    }

    .slot-item {
      width: 120px;
      height: 120px;
      background: var(--bg-panel);
      border: 2px dashed var(--border);
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px;
      text-align: center;
      position: relative;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .slot-item.active {
      border-style: solid;
      border-color: var(--accent-neon);
      background: #182236;
      box-shadow: 0 0 16px rgba(0, 242, 254, 0.2);
    }
    .slot-item.target-slot.active {
      border-color: var(--accent-gold);
      box-shadow: 0 0 16px rgba(255, 183, 3, 0.25);
    }
    .slot-label {
      font-size: 10px;
      text-transform: uppercase;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--text-muted);
      position: absolute;
      top: 6px;
    }
    .slot-img {
      font-size: 40px;
      margin: 8px 0 4px;
    }
    .slot-title {
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }
    .slot-price {
      font-size: 12px;
      font-weight: 800;
      color: var(--accent-gold);
    }

    /* Circle Gauge */
    .circle-container {
      position: relative;
      width: 180px;
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }
    svg.progress-ring {
      transform: rotate(-90deg);
      width: 100%;
      height: 100%;
    }
    .progress-ring__circle-bg {
      stroke: #182338;
      stroke-width: 12;
      fill: transparent;
    }
    .progress-ring__circle {
      stroke: var(--accent-neon);
      stroke-width: 12;
      stroke-linecap: round;
      fill: transparent;
      stroke-dasharray: 471;
      stroke-dashoffset: 471;
      transition: stroke-dashoffset 0.3s ease, stroke 0.3s ease;
    }
    .needle {
      position: absolute;
      width: 100%;
      height: 100%;
      pointer-events: none;
      transition: transform 4s cubic-bezier(0.1, 0.9, 0.2, 1);
    }
    .needle::before {
      content: '';
      position: absolute;
      top: 2px;
      left: calc(50% - 6px);
      width: 12px;
      height: 16px;
      background: #ff3366;
      clip-path: polygon(50% 100%, 0 0, 100% 0);
      filter: drop-shadow(0 0 6px #ff3366);
    }
    .circle-inner-info {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .chance-value {
      font-size: 26px;
      font-weight: 900;
      color: #fff;
    }
    .chance-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
    }
    .multiplier-val {
      font-size: 12px;
      font-weight: 800;
      color: var(--accent-neon);
      margin-top: 2px;
    }

    /* Upgrade Button */
    .upgrade-action-btn {
      width: 100%;
      max-width: 320px;
      padding: 14px;
      border-radius: 12px;
      background: linear-gradient(135deg, #00b4db, #0083b0);
      border: none;
      color: white;
      font-weight: 900;
      font-size: 16px;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0, 180, 219, 0.4);
      transition: transform 0.1s, opacity 0.2s;
    }
    .upgrade-action-btn:disabled {
      background: #243049;
      color: var(--text-muted);
      box-shadow: none;
      cursor: not-allowed;
    }
    .upgrade-action-btn:active:not(:disabled) {
      transform: scale(0.97);
    }

    /* Bottom section: Inventory & Targets */
    .selection-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }
    .section-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      background: #111723;
    }
    .sec-tab-btn {
      flex: 1;
      padding: 12px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      border-bottom: 2px solid transparent;
    }
    .sec-tab-btn.active {
      color: var(--accent-neon);
      border-bottom-color: var(--accent-neon);
      background: rgba(0, 242, 254, 0.05);
    }

    .skins-grid {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(105px, 1fr));
      gap: 10px;
      align-content: start;
    }
    .skin-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, transform 0.1s;
      position: relative;
    }
    .skin-card:active {
      transform: scale(0.96);
    }
    .skin-card.selected {
      border-color: var(--accent-neon);
      box-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
      background: #1c273e;
    }
    .skin-card.rare-covert { border-bottom: 3px solid #eb4b4b; }
    .skin-card.rare-classified { border-bottom: 3px solid #d32ce6; }
    .skin-card.rare-restricted { border-bottom: 3px solid #8847ff; }
    .skin-card.rare-milspec { border-bottom: 3px solid #4b69ff; }
    .skin-card.rare-gold { border-bottom: 3px solid #ffd700; }

    .skin-icon {
      font-size: 32px;
      margin: 4px 0 8px;
    }
    .skin-name {
      font-size: 11px;
      font-weight: 700;
      color: #fff;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }
    .skin-type {
      font-size: 10px;
      color: var(--text-muted);
      margin: 2px 0 4px;
    }
    .skin-price {
      font-size: 11px;
      font-weight: 800;
      color: var(--accent-gold);
    }

    /* Modal / Popups */
    .result-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(11, 15, 25, 0.85);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      animation: fadeIn 0.3s;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .result-dialog {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      width: 85%;
      max-width: 320px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
    }
    .result-dialog.win { border-color: var(--accent-green); }
    .result-dialog.lose { border-color: var(--accent-red); }

    .res-title {
      font-size: 22px;
      font-weight: 900;
      margin-bottom: 12px;
    }
    .res-title.win { color: var(--accent-green); text-shadow: 0 0 12px rgba(0, 231, 1, 0.4); }
    .res-title.lose { color: var(--accent-red); text-shadow: 0 0 12px rgba(255, 51, 102, 0.4); }

    .res-skin-icon { font-size: 60px; margin: 10px 0; }
    .res-skin-name { font-weight: 800; font-size: 16px; }
    .res-skin-price { font-weight: 800; font-size: 14px; color: var(--accent-gold); margin-top: 4px; }
    .res-close-btn {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      border-radius: 10px;
      background: #243049;
      border: none;
      color: white;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-box">
      <div class="logo-badge">UP</div>
      <div class="logo-text">UPGRADER</div>
    </div>
    <div class="balance-box">
      <span>🪙</span>
      <span class="balance-val" id="userBalanceDisplay">1,000</span>
      <button class="add-coins-btn" title="Пополнить бесплатно" onclick="grantFreeCoins()">+</button>
    </div>
  </header>

  <div class="app-content">

    <!-- UPGRADER CIRCLE / SLOTS -->
    <div class="upgrade-arena">
      <div class="duel-slots">
        <!-- Source Slot (From inventory or coins) -->
        <div class="slot-item active" id="sourceSlot" onclick="switchTab('inventory')">
          <span class="slot-label">Ваша ставка</span>
          <div class="slot-img" id="sourceImg">🪙</div>
          <div class="slot-title" id="sourceTitle">100 Монет</div>
          <div class="slot-price" id="sourcePrice">100</div>
        </div>

        <div style="font-size: 22px; font-weight: 900; color: var(--text-muted);">➜</div>

        <!-- Target Slot (Target skin) -->
        <div class="slot-item target-slot" id="targetSlot" onclick="switchTab('market')">
          <span class="slot-label">Целевой Скин</span>
          <div class="slot-img" id="targetImg">❓</div>
          <div class="slot-title" id="targetTitle">Выберите скин</div>
          <div class="slot-price" id="targetPrice">-</div>
        </div>
      </div>

      <!-- Dial Roulette Gauge -->
      <div class="circle-container">
        <svg class="progress-ring">
          <circle class="progress-ring__circle-bg" cx="90" cy="90" r="75"></circle>
          <circle class="progress-ring__circle" id="winArc" cx="90" cy="90" r="75"></circle>
        </svg>

        <div class="needle" id="needle"></div>

        <div class="circle-inner-info">
          <span class="chance-value" id="chanceDisplay">0%</span>
          <span class="chance-label">Шанс успеха</span>
          <span class="multiplier-val" id="multDisplay">x0.00</span>
        </div>
      </div>

      <button class="upgrade-action-btn" id="upgradeBtn" disabled onclick="startUpgrade()">
        СДЕЛАТЬ АПГРЕЙД
      </button>
    </div>

    <!-- TABS & LISTS -->
    <div class="selection-section">
      <div class="section-tabs">
        <button class="sec-tab-btn active" id="tabMarketBtn" onclick="switchTab('market')">Цели (Магазин скинов)</button>
        <button class="sec-tab-btn" id="tabInventoryBtn" onclick="switchTab('inventory')">Инвентарь (<span id="invCount">0</span>)</button>
      </div>

      <div class="skins-grid" id="marketGrid"></div>
      <div class="skins-grid" id="inventoryGrid" style="display: none;"></div>
    </div>

  </div>

  <!-- Result Dialog Overlay -->
  <div class="result-overlay" id="resultOverlay">
    <div class="result-dialog" id="resultDialog">
      <div class="res-title" id="resTitle">УСПЕХ!</div>
      <div class="res-skin-icon" id="resIcon">🔥</div>
      <div class="res-skin-name" id="resName">AK-47 | Вулкан</div>
      <div class="res-skin-price" id="resPrice">🪙 2,400</div>
      <button class="res-close-btn" onclick="closeResult()">ЗАБРАТЬ</button>
    </div>
  </div>

  <script>
    // Catalog of CS2 style skins for the Upgrader
    const CATALOG = [
      { id: 'p250_sand', name: 'Песчаная буря', type: 'P250', price: 15, rarity: 'milspec', icon: '🔫' },
      { id: 'glock_water', name: 'Водяной', type: 'Glock-18', price: 50, rarity: 'restricted', icon: '💧' },
      { id: 'usp_cortex', name: 'Извилины', type: 'USP-S', price: 120, rarity: 'classified', icon: '🧠' },
      { id: 'deagle_code', name: 'Код красного', type: 'Desert Eagle', price: 300, rarity: 'covert', icon: '🦅' },
      { id: 'm4a4_neo', name: 'Нео-нуар', type: 'M4A4', price: 650, rarity: 'covert', icon: '🌌' },
      { id: 'ak47_vulcan', name: 'Вулкан', type: 'AK-47', price: 1500, rarity: 'covert', icon: '⚡' },
      { id: 'awp_asiimov', name: 'Азимов', type: 'AWP', price: 2800, rarity: 'covert', icon: '🎯' },
      { id: 'knife_karambit', name: 'Керамбит | Градиент', type: 'Нож', price: 8500, rarity: 'gold', icon: '🗡️' },
      { id: 'knife_butterfly', name: 'Бабочка | Волны', type: 'Нож', price: 18000, rarity: 'gold', icon: '🦋' },
      { id: 'awp_dragon', name: 'История о драконе', type: 'AWP', price: 45000, rarity: 'gold', icon: '🐉' }
    ];

    let state = {
      balance: 1000,
      inventory: [
        { uid: 1, ...CATALOG[0] },
        { uid: 2, ...CATALOG[1] }
      ],
      selectedSource: null, // item or null (if null, betting coins)
      coinBet: 100,
      selectedTarget: null,
      isRolling: false
    };

    // Load saved profile
    try {
      const saved = localStorage.getItem('upgrader_best_state');
      if (saved) {
        const parsed = JSON.parse(saved);
        state.balance = parsed.balance ?? 1000;
        state.inventory = parsed.inventory || [];
      }
    } catch(e) {}

    function saveState() {
      try {
        localStorage.setItem('upgrader_best_state', JSON.stringify({
          balance: state.balance,
          inventory: state.inventory
        }));
      } catch(e) {}
    }

    const CIRCLE_CIRCUMFERENCE = 2 * Math.PI * 75; // ~471

    function updateBalance() {
      document.getElementById('userBalanceDisplay').textContent = Math.floor(state.balance).toLocaleString('ru-RU');
      document.getElementById('invCount').textContent = state.inventory.length;
      saveState();
    }

    function grantFreeCoins() {
      state.balance += 500;
      updateBalance();
      recalcChance();
    }

    function switchTab(tab) {
      document.getElementById('tabMarketBtn').classList.toggle('active', tab === 'market');
      document.getElementById('tabInventoryBtn').classList.toggle('active', tab === 'inventory');
      document.getElementById('marketGrid').style.display = tab === 'market' ? 'grid' : 'none';
      document.getElementById('inventoryGrid').style.display = tab === 'inventory' ? 'grid' : 'none';
    }

    function selectTarget(skin) {
      if (state.isRolling) return;
      state.selectedTarget = skin;
      document.getElementById('targetSlot').classList.add('active');
      document.getElementById('targetImg').textContent = skin.icon;
      document.getElementById('targetTitle').textContent = `${skin.type} | ${skin.name}`;
      document.getElementById('targetPrice').textContent = `🪙 ${skin.price}`;
      recalcChance();
    }

    function selectSourceItem(item) {
      if (state.isRolling) return;
      state.selectedSource = item;
      document.getElementById('sourceSlot').classList.add('active');
      document.getElementById('sourceImg').textContent = item.icon;
      document.getElementById('sourceTitle').textContent = `${item.type} | ${item.name}`;
      document.getElementById('sourcePrice').textContent = `🪙 ${item.price}`;
      recalcChance();
    }

    function selectCoinBet(amount) {
      if (state.isRolling) return;
      state.selectedSource = null;
      state.coinBet = amount;
      document.getElementById('sourceSlot').classList.add('active');
      document.getElementById('sourceImg').textContent = '🪙';
      document.getElementById('sourceTitle').textContent = `${amount} Монет`;
      document.getElementById('sourcePrice').textContent = `🪙 ${amount}`;
      recalcChance();
    }

    function getSourceValue() {
      if (state.selectedSource) {
        return state.selectedSource.price;
      }
      return state.coinBet;
    }

    function recalcChance() {
      const btn = document.getElementById('upgradeBtn');
      const winArc = document.getElementById('winArc');
      const chanceText = document.getElementById('chanceDisplay');
      const multText = document.getElementById('multDisplay');

      if (!state.selectedTarget) {
        btn.disabled = true;
        chanceText.textContent = "0%";
        multText.textContent = "x0.00";
        winArc.style.strokeDashoffset = CIRCLE_CIRCUMFERENCE;
        return;
      }

      const sourceVal = getSourceValue();
      const targetVal = state.selectedTarget.price;

      if (sourceVal >= targetVal) {
        chanceText.textContent = "100%";
        multText.textContent = "x1.00";
        winArc.style.strokeDashoffset = 0;
        btn.disabled = (!state.selectedSource && state.balance < state.coinBet);
        return;
      }

      // Casino standard: ~95% house payout rate
      let chance = (sourceVal / targetVal) * 95;
      if (chance > 90) chance = 90; // capped for realism
      if (chance < 0.5) chance = 0.5;

      const mult = (targetVal / sourceVal).toFixed(2);

      chanceText.textContent = chance.toFixed(1) + "%";
      multText.textContent = "x" + mult;

      // Update circular sector
      const offset = CIRCLE_CIRCUMFERENCE - (CIRCLE_CIRCUMFERENCE * (chance / 100));
      winArc.style.strokeDashoffset = offset;

      // Check if user has enough balance if using coinBet
      if (!state.selectedSource && state.balance < state.coinBet) {
        btn.disabled = true;
      } else {
        btn.disabled = false;
      }
    }

    function renderMarket() {
      const grid = document.getElementById('marketGrid');
      grid.innerHTML = '';
      CATALOG.forEach(skin => {
        const card = document.createElement('div');
        card.className = `skin-card rare-${skin.rarity}`;
        card.onclick = () => selectTarget(skin);
        card.innerHTML = `
          <div class="skin-icon">${skin.icon}</div>
          <div class="skin-name">${skin.name}</div>
          <div class="skin-type">${skin.type}</div>
          <div class="skin-price">🪙 ${skin.price}</div>
        `;
        grid.appendChild(card);
      });
    }

    function renderInventory() {
      const grid = document.getElementById('inventoryGrid');
      grid.innerHTML = '';

      // Coin bet option inside inventory
      const coinCard = document.createElement('div');
      coinCard.className = `skin-card`;
      coinCard.style.borderColor = 'var(--accent-gold)';
      coinCard.onclick = () => {
        const val = prompt("Введите сумму ставки монет:", "100");
        const num = parseInt(val, 10);
        if (num && num > 0) selectCoinBet(num);
      };
      coinCard.innerHTML = `
        <div class="skin-icon">🪙</div>
        <div class="skin-name">Поставить монеты</div>
        <div class="skin-type">Баланс: ${state.balance}</div>
        <div class="skin-price">Любая сумма</div>
      `;
      grid.appendChild(coinCard);

      state.inventory.forEach(item => {
        const card = document.createElement('div');
        card.className = `skin-card rare-${item.rarity}`;
        card.onclick = () => selectSourceItem(item);
        card.innerHTML = `
          <div class="skin-icon">${item.icon}</div>
          <div class="skin-name">${item.name}</div>
          <div class="skin-type">${item.type}</div>
          <div class="skin-price">🪙 ${item.price}</div>
        `;
        grid.appendChild(card);
      });
    }

    let currentRotation = 0;

    function startUpgrade() {
      if (state.isRolling || !state.selectedTarget) return;

      const sourceVal = getSourceValue();
      const targetVal = state.selectedTarget.price;

      if (!state.selectedSource) {
        if (state.balance < state.coinBet) {
          alert("Недостаточно виртуальных монет! Нажмите '+' возле баланса.");
          return;
        }
        state.balance -= state.coinBet;
      } else {
        // Remove item from inventory
        const idx = state.inventory.findIndex(i => i.uid === state.selectedSource.uid);
        if (idx !== -1) state.inventory.splice(idx, 1);
      }

      state.isRolling = true;
      document.getElementById('upgradeBtn').disabled = true;
      updateBalance();
      renderInventory();

      // Calculate winning angle range
      let chance = (sourceVal / targetVal) * 95;
      if (sourceVal >= targetVal) chance = 100;
      if (chance > 90) chance = 90;
      if (chance < 0.5) chance = 0.5;

      const isWin = (Math.random() * 100) <= chance;

      // Needle starts pointing up (0 deg), winning zone is from 0 deg clockwise up to (chance/100)*360 deg
      const winSectorDeg = (chance / 100) * 360;
      let targetDeg;

      if (isWin) {
        // Fall inside winning zone (avoid extreme edge by 2 degrees)
        targetDeg = Math.random() * (winSectorDeg - 4) + 2;
      } else {
        // Fall inside losing zone
        targetDeg = winSectorDeg + (Math.random() * (360 - winSectorDeg - 4) + 2);
      }

      // Add 5-7 full spins
      const fullSpins = (5 + Math.floor(Math.random() * 3)) * 360;
      currentRotation += fullSpins + (targetDeg - (currentRotation % 360));
      if (currentRotation < fullSpins) currentRotation += fullSpins;

      const needle = document.getElementById('needle');
      needle.style.transform = `rotate(${currentRotation}deg)`;

      setTimeout(() => {
        state.isRolling = false;
        showResult(isWin);
      }, 4100);
    }

    function showResult(isWin) {
      const overlay = document.getElementById('resultOverlay');
      const dialog = document.getElementById('resultDialog');
      const title = document.getElementById('resTitle');
      const icon = document.getElementById('resIcon');
      const name = document.getElementById('resName');
      const price = document.getElementById('resPrice');

      if (isWin) {
        const wonItem = { uid: Date.now(), ...state.selectedTarget };
        state.inventory.unshift(wonItem);
        dialog.className = 'result-dialog win';
        title.className = 'res-title win';
        title.textContent = '🎉 АПГРЕЙД УДАЛСЯ!';
        icon.textContent = wonItem.icon;
        name.textContent = `${wonItem.type} | ${wonItem.name}`;
        price.textContent = `🪙 +${wonItem.price}`;
      } else {
        dialog.className = 'result-dialog lose';
        title.className = 'res-title lose';
        title.textContent = '💔 АПГРЕЙД ПРОВАЛЕН';
        icon.textContent = '💨';
        name.textContent = 'Предмет сгорел';
        price.textContent = '🪙 0';
      }

      overlay.style.display = 'flex';
      updateBalance();
      renderInventory();
    }

    function closeResult() {
      document.getElementById('resultOverlay').style.display = 'none';
      // Reset source selection to safe default
      state.selectedSource = null;
      selectCoinBet(100);
    }

    // Init
    renderMarket();
    renderInventory();
    updateBalance();
    selectCoinBet(100);
    selectTarget(CATALOG[4]); // M4A4
  </script>
</body>
</html>
